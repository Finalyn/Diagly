# L'app iPhone/iPad se compile ici, sur une machine macOS de GitHub : le poste
# de développement est sous Windows et Xcode n'existe que sur Mac. Dépôt
# privé : une minute macOS en compte dix sur le forfait d'Actions, d'où des
# déclenchements automatiques limités au code natif. Le front, lui, se vérifie
# sur le poste (tsc, vitest) avant d'être poussé.
#
# - À chaque push qui touche le code natif (ios/, plugins, configuration) :
#   compilation pour le simulateur, sans signature ni secret. Elle dit
#   seulement si le projet compile.
# - À la demande (onglet Actions > App iOS > Run workflow) : archive signée,
#   envoyée sur App Store Connect, où elle apparaît dans TestFlight une
#   quinzaine de minutes plus tard.
#
# Secrets du dépôt utilisés par l'envoi (Settings > Secrets and variables > Actions) :
#   APPLE_TEAM_ID   identifiant d'équipe, 10 caractères (developer.apple.com > Membership)
#   ASC_KEY_ID      identifiant de la clé d'API App Store Connect
#   ASC_ISSUER_ID   identifiant de l'émetteur, affiché au-dessus de la liste des clés
#   ASC_KEY_P8      contenu complet du fichier AuthKey_XXXXXXXXXX.p8
#   IOS_DIST_P12, IOS_DIST_P12_PASSWORD
#                   certificat de distribution (.p12, en base64) et son mot de passe
# Voir APP-IOS.md.

name: App iOS

on:
  push:
    branches: [app-ios, master]
    paths:
      - 'ios/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/app-ios.yml'
  workflow_dispatch:
    inputs:
      testflight:
        description: Signer la version et l'envoyer sur TestFlight
        type: boolean
        default: true

concurrency:
  group: app-ios-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compiler:
    name: Compiler (simulateur, sans signature)
    if: github.event_name == 'push' || !inputs.testflight
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Front de l'app, copié dans le projet iOS
        run: npm run build:app
      - name: Compiler pour le simulateur
        run: |
          xcodebuild -version
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            -quiet build

  testflight:
    name: Signer et envoyer sur TestFlight
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    runs-on: macos-26
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - name: Secrets présents
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          IOS_DIST_P12: ${{ secrets.IOS_DIST_P12 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          manque=""
          for s in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 IOS_DIST_P12 IOS_DIST_P12_PASSWORD; do [ -n "${!s}" ] || manque="$manque $s"; done
          if [ -n "$manque" ]; then echo "::error::Secrets manquants :$manque (voir APP-IOS.md)"; exit 1; fi

      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Front de l'app, copié dans le projet iOS
        run: npm run build:app

      - name: Clé d'API App Store Connect
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey.p8"

      # La signature de distribution ne dépend d'aucun appareil enregistré,
      # contrairement à la signature automatique de Xcode (profil de
      # développement). Le certificat, créé une fois, vit dans les secrets ;
      # il passe par un trousseau jetable, effacé à la fin.
      - name: Certificat de distribution (trousseau temporaire)
        env:
          IOS_DIST_P12: ${{ secrets.IOS_DIST_P12 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          TROUSSEAU="$RUNNER_TEMP/signature.keychain-db"
          MDP=$(openssl rand -hex 16)
          printf '%s' "$IOS_DIST_P12" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          security create-keychain -p "$MDP" "$TROUSSEAU"
          security set-keychain-settings -lut 21600 "$TROUSSEAU"
          security unlock-keychain -p "$MDP" "$TROUSSEAU"
          security import "$RUNNER_TEMP/distribution.p12" -P "$IOS_DIST_P12_PASSWORD" -A -t cert -f pkcs12 -k "$TROUSSEAU"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MDP" "$TROUSSEAU" > /dev/null
          security list-keychains -d user -s "$TROUSSEAU" $(security list-keychains -d user | tr -d '"')
          openssl pkcs12 -in "$RUNNER_TEMP/distribution.p12" -passin "pass:$IOS_DIST_P12_PASSWORD" -nokeys -out "$RUNNER_TEMP/distribution.pem"
          rm -f "$RUNNER_TEMP/distribution.p12"
          security find-identity -v -p codesigning "$TROUSSEAU"

      - name: Profil App Store
        run: |
          ASC_KEY_PATH="$RUNNER_TEMP/asc/AuthKey.p8" CERT_PEM="$RUNNER_TEMP/distribution.pem" \
            node ios/outils/profil-app-store.mjs

      # Numéro de build : l'heure UTC (AAMMJJHHMM). Il croît toujours, même si
      # le workflow est renommé, ce que le numéro d'exécution ne garantit pas.
      # La signature (manuelle, distribution, profil « Diagly App Store (CI) »)
      # est réglée dans la configuration Release de la cible App.
      - name: Archiver
        run: |
          NUMERO=$(date -u +%y%m%d%H%M)
          echo "Build $NUMERO"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Diagly.xcarchive" \
            CURRENT_PROJECT_VERSION="$NUMERO" \
            OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/signature.keychain-db" \
            -quiet archive

      - name: Envoyer sur App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>ch.diagly.app</key><string>Diagly App Store (CI)</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Diagly.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Effacer la clé et le trousseau
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signature.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/asc" "$RUNNER_TEMP/distribution.pem"
